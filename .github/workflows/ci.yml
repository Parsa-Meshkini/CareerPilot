name: CI
on: [push, pull_request]
jobs:
  java-tests:
    name: Java build and tests (core, server, CLI, GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Build and test (offline: MockLlmProvider, in-memory H2; GUI render test skips without a display)
        run: mvn -B -q verify
  extension-tests:
    name: Chrome extension unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --test extension/tests/extractor.test.mjs
  design-artifacts:
    name: UML consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check UML / traceability consistency
        run: python tools/check_uml_consistency.py
      - name: Check every UMLet diagram has an up-to-date render
        run: |
          for f in $(find docs/uml/src -name '*.uxf'); do
            n=$(basename "$f" .uxf)
            test -f "docs/uml/rendered/$n.png" && test -f "docs/uml/rendered/$n.svg" || { echo "missing render for $n"; exit 1; }
          done
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
