# The server reuses every setting of the core module (it is loaded from .env, see .env.example).
server:
  port: ${SERVER_PORT:8000}
  address: 127.0.0.1
spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  main:
    banner-mode: off
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
logging:
  level:
    root: WARN
    com.careerpilot: INFO
careerpilot:
  storage-root: ${STORAGE_ROOT:${user.home}/.careerpilot/storage}
  llm:
    provider: ${LLM_PROVIDER:gemini}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    base-url: ${LLM_BASE_URL:}
    user-daily-token-budget: ${LLM_USER_DAILY_TOKEN_BUDGET:200000}
    run-token-budget: ${LLM_RUN_TOKEN_BUDGET:40000}
  email:
    auto-apply-threshold: ${EMAIL_AUTO_APPLY_THRESHOLD:0.85}
  features:
    auto-triage: ${FEATURE_AUTO_TRIAGE:true}
